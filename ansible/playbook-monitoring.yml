---
- name: Deploy monitoring stack
  hosts: monitoring
  become: true

  vars:
    app_dir: /opt/trump-card-monitoring

  tasks:
    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Add Docker GPG key + apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/ubuntu"
        suites: ["{{ ansible_distribution_release }}"]
        components: [stable]
        signed_by: "https://download.docker.com/linux/ubuntu/gpg"
        state: present

    - name: Install Docker Engine + Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Apply group membership
      ansible.builtin.meta: reset_connection

    - name: Ensure Docker is running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy monitoring docker-compose file
      ansible.builtin.copy:
        src: ../infra/docker/docker-compose.monitoring.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copy Prometheus config
      ansible.builtin.copy:
        src: ../infra/docker/prometheus.yml
        dest: "{{ app_dir }}/prometheus.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Write .env file
      ansible.builtin.copy:
        content: "GF_ADMIN_PASSWORD={{ gf_admin_password }}\n"
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      no_log: true

    - name: Start monitoring stack
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ app_dir }}"
      become: false
      changed_when: true

    - name: Wait for Grafana to be ready
      ansible.builtin.uri:
        url: "http://localhost:3000"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 10
      delay: 5