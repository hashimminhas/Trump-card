name: Backend Tests + Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: hashimminhas/trump-card/trump-card-backend
  FRONTEND_IMAGE: hashimminhas/trump-card/trump-card-frontend
jobs:
  # ─── Job 1: Test — unchanged from before ───────────────────────────────
  test:
    name: Run all test suites (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/trump_card/package-lock.json

      - name: Install dependencies
        working-directory: services/trump_card
        run: npm ci

      - name: Run banking + engine tests
        working-directory: services/trump_card
        run: node --test tests/banking.test.js tests/engine.test.js

      - name: Start backend (short timers for fast tests)
        working-directory: services/trump_card
        run: |
          EC_DB=$(pwd)/ci-test.db \
          PORT=3001 \
          EC_JWT_SECRET=ci-test-secret \
          EC_TURN_MS=2500 EC_BOT_MS=300 EC_PAUSE_MS=300 EC_GAP_MS=300 \
          nohup node app/main.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/api/health > /dev/null; then
              echo "Server is up."; exit 0
            fi
            sleep 1
          done
          echo "Server never became healthy — dumping log:"; cat server.log; exit 1

      - name: Run rooms integration tests
        working-directory: services/trump_card
        run: node tests/rooms.test.js

      - name: Run social/profile/guest/auth integration tests
        working-directory: services/trump_card
        run: node tests/social.test.js

      - name: Dump server log if any test step failed
        if: failure()
        working-directory: services/trump_card
        run: cat server.log || true

  # ─── Job 2: Build & push backend image — only runs after tests pass ───
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/trump_card
          file: services/trump_card/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3: Build & push frontend image — runs in parallel with backend ─
  build-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 4: Trivy security scan — after both images exist ─────────────
  scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push'

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          format: "sarif"
          output: "trivy-backend.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload backend scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-backend.sarif"
          category: "backend"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          format: "sarif"
          output: "trivy-frontend.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload frontend scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-frontend.sarif"
          category: "frontend"

      # ── IaC/config scan — checks the Dockerfiles themselves for
      # misconfigurations (missing USER, exposed secrets in ENV, etc.),
      # not the built images. Different failure mode than the image scans
      # above: this catches mistakes before you even build.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Dockerfiles for misconfigurations
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-config.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload config scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-config.sarif"
          category: "iac-config"