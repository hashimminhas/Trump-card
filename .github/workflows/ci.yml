name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: hashimminhas/trump-card/trump-card-backend
  FRONTEND_IMAGE: hashimminhas/trump-card/trump-card-frontend

jobs:

  # ─── Job 1: Lint ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            services/trump_card/package-lock.json
            apps/web/package-lock.json

      - name: Install backend dependencies
        working-directory: services/trump_card
        run: npm ci

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint backend
        working-directory: services/trump_card
        run: npm run lint --if-present

      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint --if-present

      - name: Type check frontend
        working-directory: apps/web
        run: npx tsc --noEmit

  # ─── Job 2: Test ─────────────────────────────────────────────────────────
  test:
    name: Run all test suites (Node 22)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/trump_card/package-lock.json

      - name: Install dependencies
        working-directory: services/trump_card
        run: npm ci

      - name: Run banking + engine tests
        working-directory: services/trump_card
        run: node --test tests/banking.test.js tests/engine.test.js

      - name: Start backend
        working-directory: services/trump_card
        run: |
          EC_DB=$(pwd)/ci-test.db \
          PORT=3001 \
          EC_JWT_SECRET=ci-test-secret \
          EC_TURN_MS=2500 EC_BOT_MS=300 EC_PAUSE_MS=300 EC_GAP_MS=300 \
          nohup node app/main.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/api/health > /dev/null; then
              echo "Server is up."; exit 0
            fi
            sleep 1
          done
          echo "Server never became healthy — dumping log:"; cat server.log; exit 1

      - name: Run rooms integration tests
        working-directory: services/trump_card
        run: node tests/rooms.test.js

      - name: Run social/profile/guest/auth integration tests
        working-directory: services/trump_card
        run: node tests/social.test.js

      - name: Dump server log if failed
        if: failure()
        working-directory: services/trump_card
        run: cat server.log || true

  # ─── Job 3a: Build backend ────────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/trump_card
          file: services/trump_card/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3b: Build frontend ───────────────────────────────────────────────
  build-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 4: Trivy security scan ──────────────────────────────────────────
  scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push'

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          format: "sarif"
          output: "trivy-backend.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload backend scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-backend.sarif"
          category: "backend"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          format: "sarif"
          output: "trivy-frontend.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload frontend scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-frontend.sarif"
          category: "frontend"

      - name: Scan Dockerfiles for misconfigurations
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-config.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload config scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-config.sarif"
          category: "iac-config"

  # ─── Job 5a: Deploy to EC2 ───────────────────────────────────────────────
  deploy-ec2:
    name: Deploy to EC2 via Ansible
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/trump-card-aws
          chmod 600 ~/.ssh/trump-card-aws

      - name: Write inventory
        run: |
          echo "[trump_card]" > ansible/inventory.ini
          echo "${{ secrets.EC2_IP }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/trump-card-aws ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> ansible/inventory.ini

      - name: Run Ansible playbook
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml \
            --extra-vars "ec_jwt_secret=${{ secrets.EC_JWT_SECRET }} gf_admin_password=${{ secrets.GF_ADMIN_PASSWORD }}"

  # ─── Job 5b: Deploy to EKS ───────────────────────────────────────────────
  deploy-eks:
    name: Deploy to EKS via Helm
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region eu-north-1 --name trump-card

      - name: Install Helm
        run: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Deploy to EKS
        run: |
          helm upgrade trump-card infra/helm/trump-card \
            --set secret.jwtSecret=${{ secrets.EC_JWT_SECRET }} \
            --set backend.tag=sha-${{ github.sha }} \
            --set frontend.tag=sha-${{ github.sha }}
          kubectl rollout restart deployment/trump-card-api
          kubectl rollout restart deployment/trump-card-web
