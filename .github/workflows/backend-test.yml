name: Backend Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "services/trump_card/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/trump_card/**"

jobs:
  test:
    name: Run all test suites (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/trump_card/package-lock.json

      - name: Install dependencies
        working-directory: services/trump_card
        run: npm ci

      # ── Pure logic tests — no server needed ─────────────────────────
      - name: Run banking + engine tests
        working-directory: services/trump_card
        run: node --test tests/banking.test.js tests/engine.test.js

      # ── Integration tests — need a live server with short timers ────
      - name: Start backend (short timers for fast tests)
        working-directory: services/trump_card
        run: |
          EC_DB=$(pwd)/ci-test.db \
          PORT=3001 \
          EC_JWT_SECRET=ci-test-secret \
          EC_TURN_MS=2500 EC_BOT_MS=300 EC_PAUSE_MS=300 EC_GAP_MS=300 \
          nohup node app/main.js > server.log 2>&1 &
          echo "Waiting for server to become healthy..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/api/health > /dev/null; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Server never became healthy — dumping log:"
          cat server.log
          exit 1

      - name: Run rooms integration tests
        working-directory: services/trump_card
        run: node tests/rooms.test.js

      - name: Run social/profile/guest/auth integration tests
        working-directory: services/trump_card
        run: node tests/social.test.js

      - name: Dump server log if any test step failed
        if: failure()
        working-directory: services/trump_card
        run: cat server.log || true