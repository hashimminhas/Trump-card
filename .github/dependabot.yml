version: 2
updates:
  # Backend dependencies
  - package-ecosystem: "npm"
    directory: "/services/trump_card"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"

  # The GitHub Actions workflow files themselves have dependencies too
  # (actions/checkout@v4, docker/build-push-action@v5, etc.) — keep those
  # pinned versions current and patched as well.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"